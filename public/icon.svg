<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 莫蘭迪奶油風圓角背景 -->
  <rect width="512" height="512" rx="115" fill="#fdfaf2"/>
  <rect width="500" height="500" x="6" y="6" rx="110" fill="none" stroke="#ebdcc4" stroke-width="4"/>

  <!-- 現代刷卡金流 / 信用卡主體 (精緻靜謐藍) -->
  <g transform="translate(0, 10)">
    <!-- 信用卡底卡 (柔和靜謐藍 #92A8D1) -->
    <rect x="80" y="150" width="352" height="220" rx="24" fill="#92A8D1"/>
    
    <!-- 信用卡磁條 (深色質感) -->
    <rect x="80" y="190" width="352" height="40" fill="#5c4d42" fill-opacity="0.3"/>

    <!-- 晶片 (奶油金 #E9C46A) -->
    <rect x="120" y="260" width="60" height="45" rx="8" fill="#E9C46A"/>
    <rect x="135" y="270" width="30" height="25" rx="4" fill="#F4E2BB"/>

    <!-- 裝飾用卡號小點點 -->
    <circle cx="210" cy="282" r="6" fill="#ffffff" fill-opacity="0.7"/>
    <circle cx="235" cy="282" r="6" fill="#ffffff" fill-opacity="0.7"/>
    <circle cx="260" cy="282" r="6" fill="#ffffff" fill-opacity="0.7"/>

    <!-- 右下角閃亮的小回血金幣與星芒 ✨ -->
    <circle cx="370" cy="315" r="35" fill="#E9C46A"/>
    <circle cx="370" cy="315" r="26" fill="#F4E2BB"/>
    <text x="370" y="325" font-family="Arial, sans-serif" font-weight="bold" font-size="32" fill="#785232" text-anchor="middle">$</text>

    <!-- 左上角追星魔法星芒 -->
    <path d="M110,110 Q110,128 92,128 Q110,128 110,146 Q110,128 128,128 Q110,128 110,110 Z" fill="#F7CAC9"/>
  </g>
</svg>
